name: Wasseruhr-CV
version: "2.0.0"
slug: wasseruhr_cv
# The add-on store description cannot be translated, so it is English.
description: >-
  Reads a water meter with a camera and OpenCV (no LLM, no cloud) and writes
  the reading to Home Assistant. With training and admin pages, in English and
  German.
url: https://github.com/mrwkhan/opencv-wasseruhr
arch:
  - aarch64
  - amd64

# Training and admin pages in the sidebar (only for logged-in users). The
# sidebar title cannot be translated, so it is the product name. Ingress uses
# the default port 8099; the watchdog uses the HEALTHCHECK in the Dockerfile.
ingress: true
panel_icon: mdi:water-pump
panel_title: Wasseruhr-CV

# Fetch the camera image and write the meter reading to Home Assistant
homeassistant_api: true

# Certificates for HTTPS (e.g. from the Let's Encrypt or DuckDNS add-on), read-only
map:
  - ssl

# Direct access in the local network. The port numbers can be chosen freely
# under Configuration → Network (empty = port closed); whether anything answers
# there is decided by the options http and https (both off by default).
ports:
  8080/tcp: 8099
  8443/tcp: 8100
# Fallback if there is no translation (translations/<language>.yaml)
ports_description:
  8080/tcp: HTTP in the local network (answers only with option http)
  8443/tcp: HTTPS in the local network (answers only with option https)

# Option names are English. Options of version 1.x (German names) are taken
# over automatically on the first start (app/migration.py).
options:
  camera: ""
  interval_minutes: 5
  sensor: sensor.wasseruhr_cv_meter_reading
  input_number: ""
  max_m3_per_hour: 3
  tolerance_m3: 0.002
  require_all_digits: true
  http: false
  https: false
  certificate: fullchain.pem
  certificate_key: privkey.pem
  learning: true
  min_score: 0.7
  min_margin: 0.08
  max_templates_per_digit: 30
  shift: 3
  admin_ingress_only: true
  language: auto
  log_level: INFO
schema:
  camera: str?
  interval_minutes: int(0,1440)
  sensor: 'match(^sensor\.[a-z0-9_]+$)?'
  input_number: str?
  max_m3_per_hour: float(0,100)
  tolerance_m3: float(0,1)
  require_all_digits: bool
  http: bool
  https: bool
  certificate: str
  certificate_key: str
  learning: bool
  min_score: float(0,1)
  min_margin: float(0,1)
  max_templates_per_digit: int(1,500)
  shift: int(0,10)
  rois: str?
  admin_ingress_only: bool
  language: list(auto|en|de)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
