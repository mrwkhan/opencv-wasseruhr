configuration:
  kamera:
    name: Kamera
    description: >-
      Kamera-Entität, deren Bild abgelesen wird, z. B. camera.wasseruhr.
      Ohne Kamera gibt es keine automatische Ablesung.
  intervall_minuten:
    name: Intervall (Minuten)
    description: >-
      So oft wird die Kamera automatisch abgelesen. 0 schaltet die automatische
      Ablesung aus.
  sensor:
    name: Sensor
    description: >-
      Hierhin schreibt das Add-on den geprüften Zählerstand (m³, Geräteklasse
      Wasser), auch fürs Energie-Dashboard. Fehlt der Sensor, wird er angelegt;
      ein vorhandener Sensor wird überschrieben. Leer lassen = kein Sensor.
  input_number:
    name: Helfer (input_number)
    description: >-
      Optional: zusätzlich einen Zahlen-Helfer setzen, z. B.
      input_number.wasserzaehler. Den Helfer muss es schon geben. Ein dort von
      Hand gesetzter Wert gilt als Korrektur des Zählerstands.
  max_m3_pro_stunde:
    name: Höchster Anstieg (m³ pro Stunde)
    description: >-
      Steigt der Wert schneller, gilt er als Lesefehler und wird verworfen
      (Standard 3).
  toleranz_m3:
    name: Toleranz (m³)
    description: >-
      Kleine Rückwärts-Abweichungen bis zu diesem Wert werden still ignoriert,
      z. B. wenn die letzte Rolle gerade dreht (Standard 0.002).
  alle_ziffern_gelernt:
    name: Erst schreiben, wenn alle Ziffern gelernt sind
    description: >-
      Solange für eine Ziffer 0–9 noch keine Vorlage existiert, wird nichts
      geschrieben. Eine nie gelernte Ziffer könnte sonst als ähnliche erkannt
      werden.
  http:
    name: HTTP im Heimnetz
    description: >-
      Lernseite und API unverschlüsselt im Heimnetz anbieten. Port unter
      Netzwerk (Standard 8099). Ohne Passwort – nie im Router freigeben.
  https:
    name: HTTPS im Heimnetz
    description: >-
      Lernseite und API verschlüsselt im Heimnetz anbieten. Port unter Netzwerk
      (Standard 8100). Ohne Passwort – nie im Router freigeben.
  zertifikat:
    name: HTTPS-Zertifikat
    description: >-
      Datei im Ordner /ssl (z. B. vom Let's-Encrypt-Add-on), Standard
      fullchain.pem. Fehlt sie, erzeugt das Add-on ein selbstsigniertes
      Zertifikat (der Browser warnt dann einmal).
  schluessel:
    name: HTTPS-Schlüssel
    description: Datei im Ordner /ssl, Standard privkey.pem.
  lerneffekt:
    name: Lerneffekt
    description: >-
      An: Neue Lernbilder werden sofort zu Vorlagen, und beim Start werden alle
      Vorlagen aus den Lernbildern neu aufgebaut. Aus: Die Vorlagen sind
      eingefroren, Lernbilder werden nur gesammelt.
  min_score:
    name: Mindest-Score
    description: >-
      So gut muss die beste Ziffer passen, damit eine Rolle als sicher gilt
      (Standard 0.70).
  min_abstand:
    name: Mindestabstand
    description: >-
      So viel besser als die zweitbeste muss die beste Ziffer passen
      (Standard 0.08).
  max_vorlagen_pro_ziffer:
    name: Vorlagen je Ziffer
    description: >-
      Höchstzahl gespeicherter Vorlagen pro Ziffer, die ältesten fallen heraus
      (Standard 30). Die Lernbilder selbst werden nie gelöscht.
  verschiebung:
    name: Verschiebung
    description: Suchbereich des Template Matchings in Pixeln, ± (Standard 3).
  rois:
    name: ROIs
    description: >-
      Nur nötig, wenn die Kamera anders sitzt: JSON-Liste [[x1,y1,x2,y2], …],
      eine pro Rolle von links nach rechts. Leer lassen = Standard für das
      640×480-Bild. Mit Lerneffekt werden die Vorlagen beim Neustart aus den
      Lernbildern neu erzeugt.
  admin_nur_ueber_ingress:
    name: Verwaltung nur über Home Assistant
    description: >-
      Löschen, Import und Export nur über die Seitenleiste, also nur für
      angemeldete Benutzer – auch wenn HTTP oder HTTPS an ist.
  log_level:
    name: Log-Level
    description: DEBUG zeigt zusätzlich übersprungene Duplikate.
network:
  8080/tcp: >-
    Port für HTTP im Heimnetz. Antwortet nur, wenn die Option „HTTP im
    Heimnetz“ an ist. Leer lassen = Port ganz zu.
  8443/tcp: >-
    Port für HTTPS im Heimnetz. Antwortet nur, wenn die Option „HTTPS im
    Heimnetz“ an ist. Leer lassen = Port ganz zu.
