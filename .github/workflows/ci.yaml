name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            wasseruhr_cv/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  addon-linter:
    name: Add-on configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: "./wasseruhr_cv"

  build:
    name: Image ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (like the Supervisor)
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t wasseruhr-cv:ci wasseruhr_cv
      - name: Start, learn, read
        run: |
          docker run -d --name wucv -p 8099:8099 wasseruhr-cv:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8099/health && break; sleep 1; done
          curl -sf -X POST -H "Content-Type: image/jpeg" --data-binary @tests/example.jpg \
            "http://localhost:8099/learn?value=506.388"
          curl -sf -X POST -H "Content-Type: image/jpeg" --data-binary @tests/example.jpg \
            http://localhost:8099/read | tee reading.json
          python3 -c "import json; d = json.load(open('reading.json')); assert d['certain'] and d['value'] == 506.388, d"
      - name: Log
        if: always()
        run: docker logs wucv
