# Keeps actions, Python packages and the base image up to date: one bundled pull
# request per area and month, the CI checks each of them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Runtime (image): fastapi, uvicorn, opencv, numpy
  - package-ecosystem: pip
    directory: /wasseruhr_cv
    schedule:
      interval: monthly
    groups:
      runtime:
        patterns: ["*"]

  # Test tools only – the runtime packages (included via -r) come from above
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: pytest
      - dependency-name: httpx2
      - dependency-name: pyyaml
    groups:
      development:
        patterns: ["*"]

  # Python base image: stay on 3.12; moving to a new Python version needs
  # matching aarch64 wheels for OpenCV/numpy and is done deliberately.
  - package-ecosystem: docker
    directory: /wasseruhr_cv
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
